<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicsBro Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Additional styles for admin panel */
    .admin-container {
      margin: 2rem;
    }
    .submissions {
      margin-top: 2rem;
    }
    .submission {
      border: 1px solid #ccc;
      padding: 1rem;
      margin-bottom: 1rem;
      background-color: #f9f9f9;
    }
    .submission-buttons button {
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">ComicsBro Admin</div>
    <nav class="nav">
      <a href="index.html">Home</a>
    </nav>
  </header>
  <main class="admin-container">
    <h1>Admin Panel</h1>
    <section id="submissions" class="submissions">
      <h2>Pending Submissions</h2>
      <div id="submissionList"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
